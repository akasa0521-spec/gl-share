const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pass){const enc=new TextEncoder();const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(CT));return new TextDecoder().decode(pt);}
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='開いています…';try{const html=await open(document.getElementById('p').value.trim());document.open();document.write(html);document.close();}catch(x){e.textContent='合言葉が違います';}});

/* --- Good Luck: 合言葉をこの端末に一度だけ覚える（追記分） --- */
var GL_KEY='gl_share_pass';
function glGet(){try{return localStorage.getItem(GL_KEY);}catch(x){return null;}}
function glSet(v){try{localStorage.setItem(GL_KEY,v);}catch(x){}}
function glDel(){try{localStorage.removeItem(GL_KEY);}catch(x){}}
function glShow(html){document.open();document.write(html);document.close();}
document.getElementById('f').addEventListener('submit',function(){var v=document.getElementById('p').value.trim();if(v)glSet(v);});
(function(){var s=glGet();if(!s)return;var e=document.getElementById('e');e.textContent='開いています…';open(s).then(glShow).catch(function(){glDel();e.textContent='合言葉が変わりました。もう一度入れてください。';});})();
