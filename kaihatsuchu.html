<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="./favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>GoodLuck — 準備中</title>
<style>
:root{color-scheme:light;
  --paper:#EDEBE6; --ink:#3A372F; --deep:#26241F;
  --usu:#B4AFA2; --usuzumi:#8B877D;
  --midori:#3E5C48; --midori-usui:#7FA089; --midori-lt:#E5EAE3;
  --kei:#DAD6C9;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --sans:"Hiragino Sans","Yu Gothic",sans-serif;
  --latin:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --futura:Futura,"Century Gothic",var(--latin);
}
*{box-sizing:border-box;}
html,body{background:#EDEBE6 !important;}
body{margin:0;color:var(--ink);font-family:var(--serif);
  line-height:2.1;letter-spacing:.05em;-webkit-font-smoothing:antialiased;
  padding:70px 26px calc(60px + env(safe-area-inset-bottom));}
.wrap{max-width:520px;margin:0 auto;}
.eyebrow{font-family:var(--futura);font-size:11px;font-weight:500;
  letter-spacing:.44em;color:var(--midori);text-transform:uppercase;margin-bottom:22px;}
h1{font-size:19px;font-weight:500;margin:0 0 30px;color:var(--deep);line-height:1.9;}
.list{display:flex;flex-direction:column;gap:10px;margin-bottom:44px;}
.card{border:1px solid var(--kei);border-radius:13px;background:#FFFEFB;
  padding:16px 19px;opacity:.86;}
.card .na{font-size:14px;color:var(--deep);display:flex;align-items:center;gap:9px;}
.card .na .dot{width:6px;height:6px;border-radius:50%;background:var(--midori-usui);flex:none;}
.card .setu{font-family:var(--sans);font-size:11px;letter-spacing:.06em;
  color:var(--usuzumi);margin-top:6px;line-height:1.9;padding-left:15px;}
.chisai{font-family:var(--sans);font-size:11px;letter-spacing:.08em;
  color:var(--usu);line-height:2.1;}
a.modoru{display:inline-block;margin-top:36px;color:var(--midori);
  text-decoration:none;border-bottom:1px solid var(--midori-usui);
  font-family:var(--sans);font-size:12px;letter-spacing:.1em;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Now Building</div>
  <h1>このあたり、まだ考えている途中です。<br>そのうち、ここに増えます。</h1>

  <div class="list">
    <div class="card">
      <div class="na"><span class="dot"></span>無料会員のしくみ</div>
      <div class="setu">あだ名で入れる、ちいさな会員登録。会員だけの機能を、少しずつ増やしていく予定です。</div>
    </div>
    <div class="card">
      <div class="na"><span class="dot"></span>AIキャンプ</div>
      <div class="setu">できあがったものを触って、超えていく講座。カンペは一枚だけ渡します。</div>
    </div>
    <div class="card">
      <div class="na"><span class="dot"></span>ひとこと、いただける窓</div>
      <div class="setu">「こうした方がいい」「ありがとう」を、その場で書けるように。</div>
    </div>
    <div class="card">
      <div class="na"><span class="dot"></span>おもちゃ箱（旧棚）</div>
      <div class="setu">前のバージョンです。中身はここに引っ越し中。しばらく残しておきます。</div>
    </div>
  </div>

  <p class="chisai">
    順番も内容も、変わることがあります。<br>
    ここに書いてあることは、まだ約束ではありません。
  </p>

  <a class="modoru" href="./noren.html">← もどる</a>
</div>
</body>
</html>
