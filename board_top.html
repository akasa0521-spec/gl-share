<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Good Luck 営業ボード</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E3B4E;--gold:#D4A63B;--paper:#F5F2EC;--line:#E6E0D3}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);font-family:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;width:min(380px,92vw);box-shadow:0 8px 30px rgba(14,59,78,.08)}
.g{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;font-weight:700;margin-bottom:10px}
h1{font-size:17px;margin:0 0 4px}
p{margin:0 0 14px;font-size:12.5px;color:#6B7280;line-height:1.7}
input{width:100%;box-sizing:border-box;font-size:16px;padding:11px 12px;border:1px solid #CBD5E1;border-radius:10px}
button{margin-top:10px;width:100%;padding:11px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.err{color:#B4232C;font-size:12px;min-height:16px;margin-top:8px}
a.big{display:block;text-decoration:none;text-align:center;margin-top:12px;padding:18px 12px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:16px}
a.big.alt{background:#fff;color:var(--navy);border:2px solid var(--gold)}
a.big span{display:block;font-weight:500;font-size:11.5px;opacity:.8;margin-top:4px}
.mini{margin-top:16px;text-align:center}
.mini button{width:auto;padding:6px 12px;background:transparent;color:#6B7280;font-weight:500;font-size:11.5px;text-decoration:underline}
[hidden]{display:none!important}
</style></head><body>
<main class="card">
  <div class="g">G</div>
  <h1>Good Luck 営業ボード</h1>
  <form id="f">
    <p>合言葉を入れてください。この端末に一度だけ覚えます。中身はこの端末の中だけで開かれます。</p>
    <input id="p" type="password" autocomplete="off" placeholder="合言葉" autofocus>
    <button type="submit">開く</button>
    <div class="err" id="e"></div>
  </form>
  <div id="menu" hidden>
    <p>合言葉はこの端末に覚えました。次からはそのまま開けます。</p>
    <a class="big" href="./board.html">営業ボード（全体）<span>チーム全体の数字を見る</span></a>
    <a class="big alt" href="./board_me.html">わたしの数字<span>自分の担当の数字を見る</span></a>
    <div class="mini"><button type="button" id="forget">この端末の記憶を消す</button></div>
  </div>
</main>
<script>
var GL_KEY='gl_share_pass';
var f=document.getElementById('f'),menu=document.getElementById('menu'),err=document.getElementById('e');
function glGet(){try{return localStorage.getItem(GL_KEY);}catch(x){return null;}}
function glSet(v){try{localStorage.setItem(GL_KEY,v);}catch(x){}}
function glDel(){try{localStorage.removeItem(GL_KEY);}catch(x){}}
function showMenu(){f.hidden=true;menu.hidden=false;}
var u8=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});};
async function verify(pass){
  var res=await fetch('./board.html',{cache:'no-store'});
  var t=await res.text();
  var m=t.match(/SALT="([^"]+)",IV="([^"]+)",CT="([^"]+)"/);
  if(!m) return true; /* 形が変わっていたら判定せず通す */
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(m[1]),iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(m[2])},key,u8(m[3]));
  return true;
}
f.addEventListener('submit',async function(ev){
  ev.preventDefault();
  var v=document.getElementById('p').value.trim();
  if(!v){err.textContent='合言葉を入れてください。';return;}
  err.textContent='確かめています…';
  try{ await verify(v); }
  catch(x){ err.textContent='合言葉が違います。'; return; }
  glSet(v); err.textContent=''; showMenu();
});
document.getElementById('forget').addEventListener('click',function(){glDel();location.reload();});
if(glGet()) showMenu();
</script>
</body></html>
